<!DOCTYPE html>
<html lang="eng">
    <head>
    <meta charset="UTF-8">
    <meta name ="viewport"content="width=device-width",initial-scale-1.0">
    <title>document</title>  
</head>
<body>
    <form>
    <h1>Registeration Form</h1>
   <fieldset>
    <label for="Fisrt Name">First Name</label>
    <input type="text" name="" id="" placeholder="Enter First Name"><br>
    <label for="Last Name">Last Name</label>
    <input type="text" placeholder="Enter Last Name"><br>
    <label for="Email">Email</label>
    <input type="email" placeholder="Enter Email Address"><br>
    <label for="Password">Password:</label>
    <input type="password" minlength="8"><br>
    <label for="Gender">Gender:</label>
    <label for="Male">Male</label>
    <input type="radio" name="Gender" value="male>">
    <label for="Female">Female</label>
    <input type="radio" name="Gender" value="female">
    <label for="Other">Other</label>
    <input type="radio" name="Gender" value="other"><br>
    <label for="Age">Age</label>
    <input type="number" name="Age"><br>
    <label for="Preferences">Preferences:</label>
    <label for="Acrylic Painting">Acrylic Painting</label>
    <input type="checkbox" name="Preferences" value="Acrylic Painting">
    <label for="Oil Painting">Oil Painting</label>
    <input type="checkbox" name="Preferences" value="Oil Painting">
    <label for="Water Color Painting">Water Color Painting</label>
    <input type="checkbox" name="Preferences" value="Water Color Painting"><br>
    <select>
        <option>English</option>
        <option>Malayalam</option>
        <option>Hindi</option>
    </select><br>
    <label for="">Bio:</label>
    <textarea placeholder="Share few lines about yourself..."></textarea><br>
    <input type="reset" value="re">
    <input type="submit" value="sub">
    
   </fieldset>
</form>
</body>
